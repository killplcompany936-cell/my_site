<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автоматическая загрузка файла</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        
        h1 {
            color: #2575fc;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .status-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin: 25px 0;
            border-left: 5px solid #2575fc;
        }
        
        .status-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .status-text {
            font-size: 1.2rem;
            color: #495057;
            margin-bottom: 10px;
        }
        
        .file-info {
            background-color: #e9f7fe;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .file-icon {
            font-size: 2.5rem;
            color: #2575fc;
        }
        
        .file-details h3 {
            color: #2575fc;
            margin-bottom: 5px;
        }
        
        .file-details p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary {
            background-color: #2575fc;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #1a68e8;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
        }
        
        .btn-secondary {
            background-color: #f1f3f5;
            color: #495057;
        }
        
        .btn-secondary:hover {
            background-color: #e9ecef;
            transform: translateY(-3px);
        }
        
        .instructions {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
            text-align: left;
        }
        
        .instructions h3 {
            color: #2575fc;
            margin-bottom: 15px;
        }
        
        .instructions ol {
            padding-left: 20px;
            line-height: 1.8;
        }
        
        .instructions li {
            margin-bottom: 10px;

}
        
        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
        
        .countdown {
            font-size: 1.5rem;
            color: #2575fc;
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Автоматическая загрузка файла</h1>
        
        <p class="subtitle">Файл будет автоматически загружен через несколько секунд после загрузки страницы. Если загрузка не началась, используйте кнопку ниже.</p>
        
        <div class="status-box">
            <div class="status-icon">⏳</div>
            <div class="status-text">Подготовка к загрузке файла...</div>
            <div class="countdown" id="countdown">5</div>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" id="downloadBtn">
                <span>⬇️</span> Скачать файл сейчас
            </button>
            <button class="btn btn-secondary" id="cancelBtn">
                <span>❌</span> Отменить загрузку
            </button>
        </div>

        <div class="footer">
            <p>Сайт для автоматической загрузки файлов | Создано с помощью HTML, CSS и JavaScript</p>
        </div>
    </div>

    <script>
        const fileName = 'Counter Kill PL.zip';
        let countdownValue = 5;
        let countdownInterval;
        let downloadStarted = false;
        
        const countdownElement = document.getElementById('countdown');
        const downloadBtn = document.getElementById('downloadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const statusIcon = document.querySelector('.status-icon');
        const statusText = document.querySelector('.status-text');
        
        function startCountdown() {
            countdownElement.textContent = countdownValue;
            
            countdownInterval = setInterval(() => {
                countdownValue--;
                countdownElement.textContent = countdownValue;
                
                if (countdownValue <= 0) {
                    clearInterval(countdownInterval);
                    startDownload();
                }
            }, 1000);
        }

        function startDownload() {
            if (downloadStarted) return;
            
            downloadStarted = true;
            statusIcon.textContent = '⬇️';
            statusText.textContent = 'Загрузка началась...';
            
            const downloadLink = document.createElement('a');
            downloadLink.href = 'downloads/' + fileName;
            downloadLink.download = fileName;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            setTimeout(() => {
                statusIcon.textContent = '✅';
                statusText.textContent = 'Файл успешно загружен!';
                countdownElement.style.display = 'none';
            }, 1500);
        }
        
        function cancelDownload() {
            clearInterval(countdownInterval);
            statusIcon.textContent = '❌';
            statusText.textContent = 'Загрузка отменена';
            countdownElement.style.display = 'none';
            downloadStarted = true;
        }
        
        downloadBtn.addEventListener('click', startDownload);
        cancelBtn.addEventListener('click', cancelDownload);
        
        window.addEventListener('load', startCountdown);
        
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (!downloadStarted) {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = 'downloads/' + fileName;
                    document.body.appendChild(iframe);
                }
            }, 7000);
        });
    </script>
</body>
</html>
